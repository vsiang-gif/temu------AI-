name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt nuitka ordered-set zstandard

      - name: Inject server config
        if: ${{ vars.TPE_SERVER_URL != '' && vars.TPE_PUBLIC_KEY != '' }}
        shell: python
        env:
          TPE_SERVER_URL: ${{ vars.TPE_SERVER_URL }}
          TPE_PUBLIC_KEY: ${{ vars.TPE_PUBLIC_KEY }}
        run: |
          import os, re, pathlib
          p = pathlib.Path("app/config.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'SERVER_URL = ".*"', f'SERVER_URL = "{os.environ["TPE_SERVER_URL"]}"', s)
          s = re.sub(r'PUBLIC_KEY_B64 = ".*"', f'PUBLIC_KEY_B64 = "{os.environ["TPE_PUBLIC_KEY"]}"', s)
          p.write_text(s, encoding="utf-8")

      - name: Download U2-Net model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx -OutFile models/u2net.onnx

      - name: Build with Nuitka
        run: >
          python -m nuitka main.py
          --standalone --onefile
          --assume-yes-for-downloads
          --enable-plugin=pyside6
          --windows-console-mode=disable
          --include-data-dir=models=models
          "--onefile-tempdir-spec={CACHE_DIR}/TemuPrintExtractor/{VERSION}"
          --product-version=1.0.0 --file-version=1.0.0
          --output-filename=TemuPrintExtractor.exe
          --output-dir=dist

      - uses: actions/upload-artifact@v4
        with:
          name: TemuPrintExtractor
          path: desktop/dist/TemuPrintExtractor.exe
